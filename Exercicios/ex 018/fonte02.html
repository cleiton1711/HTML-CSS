<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Magic';
            src: url('the-magic.ttf'),
            format('truetype');
        }
            @font-face {
    
         
            font-family: 'Monster';
            src: url('Monster.ttf') format('truetype'), 
                 url('Monster.otf') format('opentype');          
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Magic',sans-serif;
            font-size: 4em;

        }
        p{
            font-family: 'Monster',sans-serif;

        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aut delectus veniam ullam doloremque eveniet, enim error commodi in illo expedita pariatur velit officia vel sapiente saepe. Iste, placeat aliquid. Sed!</p>
</body>
</html>
