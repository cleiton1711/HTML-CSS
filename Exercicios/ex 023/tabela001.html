<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }

        table{
            height: 400px;
            width: 400px;
            border-collapse: collapse;
        }
        tr.linha{
            background-color: gray;
        }

        td{
            text-align: left;
            vertical-align: top;
            border: 1px solid black;
            padding: 8px;
        }

        td.dado{
            background-color: yellowgreen
            ;
        }
    </style>
</head>
<body>
    <body>
        <h1>Minha primeira tabela</h1>

        <table>
            <tr>
                <td>A1</td>
                <td>B1</td>
                <td>C1</td>
                <td>D1</td>
            </tr>
            <tr>
                <td>A2</td>
                <td>B2</td>
                <td>C2</td>
                <td>D2</td>
            </tr>    
            <tr >
                <td>A3</td>
                <td >B3</td>
                <td>C3</td>
                <td>D3</td>
            </tr>    
        </table>
    </body>
    
</body>
</html>
