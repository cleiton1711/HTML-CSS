<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            text-align: center;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
        }
        thead{
            background-color: gray;
            color: white;
        }

        .thcolor{
            background-color: gray;
            color: white;
        }

    </style>
</head>
<body>
    <h1>Desafio de Tabelas Proposto</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" colspan="1" scope="rowgroup">Área</th>
                <th  rowspan="2" colspan="3" scope="rowgroup">Disciplinas</th>
                <th colspan="2" scope="rowgroup">Notas</th>
                <th rowspan="2" scope="rowgroup">Média</th>
            </tr>
            <tr>
                <th scope="rowgroup">Nota1</th>
                <th scope="rowgroup">Nota2</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <th rowspan="4" scope="row">Exatas</th>
                <td colspan="3">Matemática</td>
                <td>0.8</td>
                <td>0.9</td>
                <td>1.8</td>
            </tr>
            <tr>
                <td colspan="3">Fisica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
               <td colspan="3">Quimica</td>
               <td>0.0</td>
               <td>0.0</td>
               <td>0.0</td>  
            </tr>
            <tr>
                <td colspan="3">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="6" class="thcolor" scope="col">Média de Exatas</th>
                <td class="thcolor">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td colspan="3">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="3">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="6" class="thcolor" scope="col">Média de Humanas</th>
                <td class="thcolor">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
